  <div id="intro-loader" class="intro-loader" aria-hidden="true">
    <svg class="intro-loader__art" viewBox="0 0 78.97 100" focusable="false">
      <path class="intro-loader__glow"
        d="M 0 0 L 39.48 27.31 L 78.97 0 L 78.97 10.89 L 63.84 21.4 L 63.84 71.77 L 64.58 71.77 L 78.97 61.62 L 78.97 72.69 L 39.48 100 L 0 72.69 L 0 0.19 Z" />
      <path class="intro-loader__core"
        d="M 0 0 L 39.48 27.31 L 78.97 0 L 78.97 10.89 L 63.84 21.4 L 63.84 71.77 L 64.58 71.77 L 78.97 61.62 L 78.97 72.69 L 39.48 100 L 0 72.69 L 0 0.19 Z" />
      <circle class="intro-loader__spark" r="1.7" />
    </svg>
  </div>
  <noscript>
    <style>#intro-loader { display: none; }</style>
  </noscript>
  <script>
    (function () {
      var KEY = 'neeiIntroSeen';
      var el = document.getElementById('intro-loader');
      if (!el) return;
      var seen = false;
      try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) { }
      if (seen) { el.remove(); return; }
      try { sessionStorage.setItem(KEY, '1'); } catch (e) { }
      el.addEventListener('animationend', function (e) {
        if (e.target === el) el.remove();
      });
    })();
  </script>
